<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NanoClaw Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #1a1a2e;
    --floor: #16213e;
    --wall: #0f3460;
    --accent: #e94560;
    --green: #00ff88;
    --crt-bg: #0a0a12;
    --text: #e0e0e0;
    --text-dim: #666;
  }

  body {
    font-family: 'Press Start 2P', monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    image-rendering: pixelated;
  }

  /* ── Room ── */
  .room {
    flex: 1;
    position: relative;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(255,255,255,.02) 31px, rgba(255,255,255,.02) 32px),
      repeating-linear-gradient(90deg, transparent, transparent 31px, rgba(255,255,255,.02) 31px, rgba(255,255,255,.02) 32px),
      linear-gradient(180deg, var(--wall) 0%, var(--bg) 60%, var(--floor) 100%);
    overflow: hidden;
  }

  /* pixel grid dots */
  .room::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 16px 16px;
    pointer-events: none;
  }

  /* ── Claw Character ── */
  .claw-wrap {
    position: absolute;
    bottom: 20%;
    left: 50%;
    transform: translateX(-50%);
    transition: filter 0.5s;
  }

  .claw {
    position: relative;
    width: 80px;
    height: 70px;
    animation: float 3s ease-in-out infinite;
  }

  /* body */
  .claw-body {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 40px;
    background: var(--accent);
    border-radius: 12px 12px 8px 8px;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.3);
  }

  /* eyes */
  .eye {
    position: absolute;
    top: 10px;
    width: 10px;
    height: 10px;
    background: #fff;
    border-radius: 50%;
    transition: all 0.3s;
  }
  .eye::after {
    content: '';
    position: absolute;
    width: 5px;
    height: 5px;
    background: #111;
    border-radius: 50%;
    top: 3px;
    left: 3px;
  }
  .eye-l { left: 10px; }
  .eye-r { right: 10px; }

  /* sleeping eyes */
  .sleeping .eye {
    height: 3px;
    top: 14px;
    border-radius: 0;
    background: #fff;
  }
  .sleeping .eye::after { display: none; }

  /* running glow */
  .running .eye {
    background: var(--green);
    box-shadow: 0 0 8px var(--green), 0 0 16px var(--green);
  }
  .running .eye::after {
    background: #fff;
  }
  .running .claw-body {
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.3), 0 0 20px rgba(0,255,136,.3);
  }

  /* pincers */
  .pincer {
    position: absolute;
    top: -5px;
    width: 20px;
    height: 28px;
    border: 4px solid var(--accent);
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    transition: transform 0.3s;
  }
  .pincer-l {
    left: 2px;
    transform: rotate(-15deg);
    transform-origin: bottom right;
    animation: pinch-l 2s ease-in-out infinite;
  }
  .pincer-r {
    right: 2px;
    transform: rotate(15deg);
    transform-origin: bottom left;
    animation: pinch-r 2s ease-in-out infinite;
  }

  .running .pincer-l { animation: pinch-l 0.6s ease-in-out infinite; }
  .running .pincer-r { animation: pinch-r 0.6s ease-in-out infinite; }

  /* legs */
  .legs {
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
  }
  .leg {
    width: 6px;
    height: 10px;
    background: var(--accent);
    border-radius: 0 0 3px 3px;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.3);
  }

  /* zzz animation */
  .zzz {
    position: absolute;
    top: -20px;
    right: -15px;
    font-size: 8px;
    color: var(--text-dim);
    opacity: 0;
  }
  .sleeping .zzz { animation: zzz 2.5s ease-in-out infinite; }
  .zzz:nth-child(2) { animation-delay: 0.8s !important; right: -25px; top: -30px; font-size: 10px; }
  .zzz:nth-child(3) { animation-delay: 1.6s !important; right: -32px; top: -42px; font-size: 12px; }

  /* shadow */
  .claw-shadow {
    position: absolute;
    bottom: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 10px;
    background: rgba(0,0,0,.3);
    border-radius: 50%;
    animation: shadow-pulse 3s ease-in-out infinite;
  }

  /* ── CRT Monitor ── */
  .crt-wrap {
    position: absolute;
    top: 8%;
    right: 8%;
    width: 340px;
  }

  .crt-frame {
    background: #333;
    border-radius: 10px;
    padding: 10px;
    box-shadow: 4px 4px 0 rgba(0,0,0,.5);
  }

  .crt-screen {
    background: var(--crt-bg);
    border-radius: 4px;
    padding: 8px;
    height: 200px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 10px;
    line-height: 1.5;
    color: var(--green);
    position: relative;
    scrollbar-width: thin;
    scrollbar-color: #333 var(--crt-bg);
  }

  /* scanlines */
  .crt-screen::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,.15) 2px,
      rgba(0,0,0,.15) 4px
    );
    pointer-events: none;
    border-radius: 4px;
  }

  .crt-screen::-webkit-scrollbar { width: 6px; }
  .crt-screen::-webkit-scrollbar-track { background: var(--crt-bg); }
  .crt-screen::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

  .crt-label {
    text-align: center;
    font-size: 7px;
    color: #666;
    margin-top: 6px;
  }

  .crt-stand {
    width: 30px;
    height: 15px;
    background: #333;
    margin: 0 auto;
    clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%);
  }

  .crt-base {
    width: 60px;
    height: 6px;
    background: #333;
    margin: 0 auto;
    border-radius: 0 0 3px 3px;
  }

  .log-line { margin: 2px 0; word-break: break-all; }
  .log-line.error { color: var(--accent); }
  .log-line.info { color: #6ec6ff; }
  .log-line.warn { color: #ffd740; }

  /* ── Room Decorations ── */
  .poster {
    position: absolute;
    top: 10%;
    left: 8%;
    width: 80px;
    height: 60px;
    background: linear-gradient(135deg, #e94560, #533483);
    border: 3px solid #444;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 6px;
    color: rgba(255,255,255,.8);
    text-align: center;
    line-height: 1.5;
    box-shadow: 2px 2px 0 rgba(0,0,0,.5);
  }

  .shelf {
    position: absolute;
    top: 35%;
    left: 6%;
    width: 100px;
    height: 6px;
    background: #4a3728;
    box-shadow: 0 2px 0 #3a2a1f;
  }
  .shelf::before, .shelf::after {
    content: '';
    position: absolute;
    bottom: 6px;
    width: 14px;
    height: 20px;
    border-radius: 2px 2px 0 0;
  }
  .shelf::before {
    left: 10px;
    background: #e94560;
    box-shadow: inset -2px 0 0 rgba(0,0,0,.2);
  }
  .shelf::after {
    left: 28px;
    background: #533483;
    height: 16px;
    box-shadow: inset -2px 0 0 rgba(0,0,0,.2);
  }

  .plant {
    position: absolute;
    bottom: 18%;
    right: 5%;
  }
  .plant-pot {
    width: 24px;
    height: 18px;
    background: #8b4513;
    clip-path: polygon(10% 0, 90% 0, 100% 100%, 0 100%);
    margin: 0 auto;
  }
  .plant-leaf {
    width: 8px;
    height: 20px;
    background: #2d8a4e;
    border-radius: 50% 50% 0 0;
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform-origin: bottom center;
  }
  .plant-leaf:nth-child(1) { transform: translateX(-50%) rotate(-20deg); }
  .plant-leaf:nth-child(2) { transform: translateX(-50%) rotate(0deg); height: 26px; }
  .plant-leaf:nth-child(3) { transform: translateX(-50%) rotate(20deg); }

  /* status indicator in room */
  .status-orb {
    position: absolute;
    top: 12%;
    right: calc(8% + 170px - 8px);
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: all 0.5s;
  }
  .status-orb.on {
    background: var(--green);
    box-shadow: 0 0 8px var(--green), 0 0 16px var(--green);
  }

  /* ── Control Bar ── */
  .controls {
    background: #111;
    border-top: 2px solid #333;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    min-height: 56px;
  }

  .status-light {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 8px;
  }
  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #555;
    border: 2px solid #333;
    transition: all 0.3s;
  }
  .status-dot.on {
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
  }
  .status-dot.error {
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
  }

  .status-text {
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .status-text.on { color: var(--green); }

  .btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    padding: 10px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.15s;
    position: relative;
    box-shadow: 0 4px 0 rgba(0,0,0,.4);
  }
  .btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 rgba(0,0,0,.4);
  }
  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  .btn-start {
    background: var(--green);
    color: #111;
  }
  .btn-start:hover:not(:disabled) { background: #00cc6e; }

  .btn-stop {
    background: var(--accent);
    color: #fff;
  }
  .btn-stop:hover:not(:disabled) { background: #d13050; }

  .uptime {
    margin-left: auto;
    font-size: 8px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }
  .uptime span { color: var(--text); }

  /* ── Animations ── */
  @keyframes float {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-8px); }
  }

  @keyframes shadow-pulse {
    0%, 100% { transform: translateX(-50%) scaleX(1); opacity: 0.3; }
    50% { transform: translateX(-50%) scaleX(0.85); opacity: 0.2; }
  }

  @keyframes pinch-l {
    0%, 100% { transform: rotate(-15deg); }
    50% { transform: rotate(-5deg); }
  }
  @keyframes pinch-r {
    0%, 100% { transform: rotate(15deg); }
    50% { transform: rotate(5deg); }
  }

  @keyframes zzz {
    0% { opacity: 0; transform: translateY(0) scale(0.8); }
    50% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-15px) scale(1.1); }
  }

  /* running state: faster float */
  .running .claw {
    animation-duration: 1.2s;
  }
  .running .claw-shadow {
    animation-duration: 1.2s;
  }

  /* ── Responsive ── */
  @media (max-width: 700px) {
    .crt-wrap { width: 260px; top: 5%; right: 4%; }
    .crt-screen { height: 140px; font-size: 9px; }
    .poster { display: none; }
    .shelf { display: none; }
    .controls { padding: 10px 12px; gap: 10px; }
    .btn { padding: 8px 14px; font-size: 8px; }
  }
</style>
</head>
<body>

<div class="room">
  <!-- Decorations -->
  <div class="poster">NANO<br>CLAW<br>v1.0</div>

  <div class="shelf"></div>

  <div class="plant">
    <div class="plant-leaf"></div>
    <div class="plant-leaf"></div>
    <div class="plant-leaf"></div>
    <div class="plant-pot"></div>
  </div>

  <!-- CRT Monitor -->
  <div class="crt-wrap">
    <div class="crt-frame">
      <div class="crt-screen" id="logScreen">
        <div class="log-line info">NanoClaw Dashboard ready.</div>
        <div class="log-line">Waiting for bot to start...</div>
      </div>
    </div>
    <div class="crt-label">LOG MONITOR</div>
    <div class="crt-stand"></div>
    <div class="crt-base"></div>
  </div>

  <div class="status-orb" id="statusOrb"></div>

  <!-- Claw Character -->
  <div class="claw-wrap">
    <div id="clawChar" class="claw sleeping">
      <div class="claw-body">
        <div class="eye eye-l"></div>
        <div class="eye eye-r"></div>
      </div>
      <div class="pincer pincer-l"></div>
      <div class="pincer pincer-r"></div>
      <div class="legs">
        <div class="leg"></div>
        <div class="leg"></div>
        <div class="leg"></div>
      </div>
      <span class="zzz">z</span>
      <span class="zzz">z</span>
      <span class="zzz">z</span>
      <div class="claw-shadow"></div>
    </div>
  </div>
</div>

<!-- Control Bar -->
<div class="controls">
  <div class="status-light">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusLabel">Offline</span>
  </div>

  <button class="btn btn-start" id="btnStart" onclick="startBot()">Start</button>
  <button class="btn btn-stop" id="btnStop" onclick="stopBot()" disabled>Stop</button>

  <div class="uptime">
    UPTIME <span id="uptimeVal">--:--:--</span>
  </div>
</div>

<script>
  const logScreen = document.getElementById('logScreen');
  const clawChar = document.getElementById('clawChar');
  const statusDot = document.getElementById('statusDot');
  const statusOrb = document.getElementById('statusOrb');
  const statusLabel = document.getElementById('statusLabel');
  const btnStart = document.getElementById('btnStart');
  const btnStop = document.getElementById('btnStop');
  const uptimeVal = document.getElementById('uptimeVal');

  let eventSource = null;
  let botRunning = false;
  let startTime = null;
  let uptimeTimer = null;

  function setRunning(running) {
    botRunning = running;
    clawChar.className = 'claw ' + (running ? 'running' : 'sleeping');
    statusDot.className = 'status-dot' + (running ? ' on' : '');
    statusOrb.className = 'status-orb' + (running ? ' on' : '');
    statusLabel.className = 'status-text' + (running ? ' on' : '');
    statusLabel.textContent = running ? 'Running' : 'Offline';
    btnStart.disabled = running;
    btnStop.disabled = !running;

    if (running && !startTime) {
      startTime = Date.now();
      uptimeTimer = setInterval(updateUptime, 1000);
    }
    if (!running) {
      startTime = null;
      clearInterval(uptimeTimer);
      uptimeVal.textContent = '--:--:--';
    }
  }

  function updateUptime() {
    if (!startTime) return;
    const diff = Math.floor((Date.now() - startTime) / 1000);
    const h = String(Math.floor(diff / 3600)).padStart(2, '0');
    const m = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
    const s = String(diff % 60).padStart(2, '0');
    uptimeVal.textContent = `${h}:${m}:${s}`;
  }

  function addLog(text, type) {
    const div = document.createElement('div');
    div.className = 'log-line' + (type ? ' ' + type : '');
    div.textContent = text;
    logScreen.appendChild(div);

    // Keep max 500 lines
    while (logScreen.children.length > 500) {
      logScreen.removeChild(logScreen.firstChild);
    }

    logScreen.scrollTop = logScreen.scrollHeight;
  }

  function connectSSE() {
    if (eventSource) eventSource.close();
    eventSource = new EventSource('/events');

    eventSource.addEventListener('log', (e) => {
      const data = JSON.parse(e.data);
      addLog(data.text, data.type);
    });

    eventSource.addEventListener('status', (e) => {
      const data = JSON.parse(e.data);
      setRunning(data.running);
      if (data.running && data.uptime) {
        startTime = Date.now() - data.uptime * 1000;
        if (!uptimeTimer) uptimeTimer = setInterval(updateUptime, 1000);
        updateUptime();
      }
    });

    eventSource.onerror = () => {
      setTimeout(connectSSE, 3000);
    };
  }

  async function startBot() {
    btnStart.disabled = true;
    addLog('> Starting bot...', 'info');
    try {
      const res = await fetch('/start', { method: 'POST' });
      const data = await res.json();
      if (!data.ok) addLog('Error: ' + data.error, 'error');
    } catch (e) {
      addLog('Failed to start: ' + e.message, 'error');
      btnStart.disabled = false;
    }
  }

  async function stopBot() {
    btnStop.disabled = true;
    addLog('> Stopping bot...', 'info');
    try {
      const res = await fetch('/stop', { method: 'POST' });
      const data = await res.json();
      if (!data.ok) addLog('Error: ' + data.error, 'error');
    } catch (e) {
      addLog('Failed to stop: ' + e.message, 'error');
      btnStop.disabled = false;
    }
  }

  // Initial status check
  async function checkStatus() {
    try {
      const res = await fetch('/status');
      const data = await res.json();
      setRunning(data.running);
      if (data.running && data.uptime) {
        startTime = Date.now() - data.uptime * 1000;
        if (!uptimeTimer) uptimeTimer = setInterval(updateUptime, 1000);
        updateUptime();
      }
    } catch (e) {
      // server not ready yet
    }
  }

  checkStatus();
  connectSSE();
</script>

</body>
</html>
