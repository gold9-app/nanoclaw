<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NanoClaw Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #1a1a2e;
    --floor: #16213e;
    --wall: #0f3460;
    --accent: #e94560;
    --green: #00ff88;
    --crt-bg: #0a0a12;
    --text: #e0e0e0;
    --text-dim: #666;
  }

  body {
    font-family: 'Press Start 2P', monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    image-rendering: pixelated;
  }

  /* ── Game Canvas Area ── */
  .game-area {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  #gameCanvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* ── CRT Monitor (HTML overlay) ── */
  .crt-wrap {
    position: absolute;
    top: 8%;
    right: 8%;
    width: 340px;
    z-index: 10;
  }

  .crt-frame {
    background: #333;
    border-radius: 10px;
    padding: 10px;
    box-shadow: 4px 4px 0 rgba(0,0,0,.5);
  }

  .crt-screen {
    background: var(--crt-bg);
    border-radius: 4px;
    padding: 8px;
    height: 200px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 10px;
    line-height: 1.5;
    color: var(--green);
    position: relative;
    scrollbar-width: thin;
    scrollbar-color: #333 var(--crt-bg);
  }

  .crt-screen::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,.15) 2px,
      rgba(0,0,0,.15) 4px
    );
    pointer-events: none;
    border-radius: 4px;
  }

  .crt-screen::-webkit-scrollbar { width: 6px; }
  .crt-screen::-webkit-scrollbar-track { background: var(--crt-bg); }
  .crt-screen::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

  .crt-label {
    text-align: center;
    font-size: 7px;
    color: #666;
    margin-top: 6px;
  }

  .crt-stand {
    width: 30px;
    height: 15px;
    background: #333;
    margin: 0 auto;
    clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%);
  }

  .crt-base {
    width: 60px;
    height: 6px;
    background: #333;
    margin: 0 auto;
    border-radius: 0 0 3px 3px;
  }

  .log-line { margin: 2px 0; word-break: break-all; }
  .log-line.error { color: var(--accent); }
  .log-line.info { color: #6ec6ff; }
  .log-line.warn { color: #ffd740; }

  /* ── Control Bar ── */
  .controls {
    background: #111;
    border-top: 2px solid #333;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    min-height: 56px;
    z-index: 10;
  }

  .status-light {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 8px;
  }
  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #555;
    border: 2px solid #333;
    transition: all 0.3s;
  }
  .status-dot.on {
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
  }
  .status-dot.error {
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
  }

  .status-text {
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .status-text.on { color: var(--green); }

  .btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    padding: 10px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.15s;
    position: relative;
    box-shadow: 0 4px 0 rgba(0,0,0,.4);
  }
  .btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 rgba(0,0,0,.4);
  }
  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  .btn-start {
    background: var(--green);
    color: #111;
  }
  .btn-start:hover:not(:disabled) { background: #00cc6e; }

  .btn-stop {
    background: var(--accent);
    color: #fff;
  }
  .btn-stop:hover:not(:disabled) { background: #d13050; }

  .uptime {
    margin-left: auto;
    font-size: 8px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }
  .uptime span { color: var(--text); }

  /* ── Responsive ── */
  @media (max-width: 700px) {
    .crt-wrap { width: 260px; top: 5%; right: 4%; }
    .crt-screen { height: 140px; font-size: 9px; }
    .controls { padding: 10px 12px; gap: 10px; }
    .btn { padding: 8px 14px; font-size: 8px; }
  }
</style>
</head>
<body>

<div class="game-area">
  <canvas id="gameCanvas"></canvas>

  <!-- CRT Monitor (HTML overlay) -->
  <div class="crt-wrap">
    <div class="crt-frame">
      <div class="crt-screen" id="logScreen">
        <div class="log-line info">NanoClaw Dashboard ready.</div>
        <div class="log-line">Waiting for bot to start...</div>
      </div>
    </div>
    <div class="crt-label">LOG MONITOR</div>
    <div class="crt-stand"></div>
    <div class="crt-base"></div>
  </div>
</div>

<!-- Control Bar -->
<div class="controls">
  <div class="status-light">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusLabel">Offline</span>
  </div>

  <button class="btn btn-start" id="btnStart" onclick="startBot()">Start</button>
  <button class="btn btn-stop" id="btnStop" onclick="stopBot()" disabled>Stop</button>

  <div class="uptime">
    UPTIME <span id="uptimeVal">--:--:--</span>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════
//  NanoClaw Canvas Pixel Art Game Engine
// ════════════════════════════════════════════════════════════

// ── DOM refs ──
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const logScreen = document.getElementById('logScreen');
const statusDot = document.getElementById('statusDot');
const statusLabel = document.getElementById('statusLabel');
const btnStart = document.getElementById('btnStart');
const btnStop = document.getElementById('btnStop');
const uptimeVal = document.getElementById('uptimeVal');

// ── SSE / Bot state ──
let eventSource = null;
let botRunning = false;
let startTime = null;
let uptimeTimer = null;

// ════════════════════════════════════════════════════════════
//  1. Palette & Sprite System
// ════════════════════════════════════════════════════════════

const PALETTE = {
  '_': null,                // transparent
  'R': '#e94560',           // red (accent / body)
  'r': '#c23050',           // dark red
  'W': '#ffffff',           // white
  'w': '#cccccc',           // light gray
  'K': '#111111',           // black
  'k': '#333333',           // dark gray
  'G': '#00ff88',           // green (eyes running)
  'g': '#00cc6e',           // dark green
  'B': '#6ec6ff',           // blue
  'b': '#4a90b8',           // dark blue
  'S': '#ffcc88',           // skin/beige
  's': '#cc9966',           // dark skin
  'O': '#ff9944',           // orange
  'P': '#533483',           // purple
  'p': '#3a2460',           // dark purple
  'Y': '#ffd740',           // yellow
  'T': '#2d8a4e',           // teal/plant green
  't': '#1e6b38',           // dark plant green
  'N': '#8b4513',           // brown
  'n': '#6b3410',           // dark brown
};

// 16x16 sprite data — each string is one row (16 chars)
const SPRITES = {
  // ── Idle frame 1 (standing) ──
  idle1: [
    '____RRRRRR____',   // row 0  (14 chars padded to 16 below)
    '___RRRRRRRR___',
    '__RRRrRRRrRR__',
    '__RRWKRRWKRR__',   // eyes: white + black pupil
    '__RRRRRRRRRR__',
    '__RRRRrrRRRR__',   // mouth line
    '___RRRRRRRR___',
    '___RRRRRRRR___',
    '____RRRRRR____',
    '____RRRRRR____',
    '____RRRRRR____',
    '____RRRRRR____',
    '_____RRRR_____',
    '____RR__RR____',   // legs apart
    '____RR__RR____',
    '____rr__rr____',   // feet
  ],
  // ── Idle frame 2 (blink) ──
  idle2: [
    '____RRRRRR____',
    '___RRRRRRRR___',
    '__RRRrRRRrRR__',
    '__RRKKRRKKrR__',   // eyes closed (flat line)
    '__RRRRRRRRRR__',
    '__RRRRrrRRRR__',
    '___RRRRRRRR___',
    '___RRRRRRRR___',
    '____RRRRRR____',
    '____RRRRRR____',
    '____RRRRRR____',
    '____RRRRRR____',
    '_____RRRR_____',
    '____RR__RR____',
    '____RR__RR____',
    '____rr__rr____',
  ],
  // ── Walk frame 1 (left leg forward) ──
  walk1: [
    '____RRRRRR____',
    '___RRRRRRRR___',
    '__RRRrRRRrRR__',
    '__RRWKRRWKRR__',
    '__RRRRRRRRRR__',
    '__RRRRrrRRRR__',
    '___RRRRRRRR___',
    '___RRRRRRRR___',
    '____RRRRRR____',
    '____RRRRRR____',
    '____RRRRRR____',
    '____RRRRRR____',
    '_____RRRR_____',
    '___RR____RR___',   // legs wide
    '___RR____RR___',
    '___rr____rr___',
  ],
  // ── Walk frame 2 (right leg forward) ──
  walk2: [
    '____RRRRRR____',
    '___RRRRRRRR___',
    '__RRRrRRRrRR__',
    '__RRWKRRWKRR__',
    '__RRRRRRRRRR__',
    '__RRRRrrRRRR__',
    '___RRRRRRRR___',
    '___RRRRRRRR___',
    '____RRRRRR____',
    '____RRRRRR____',
    '____RRRRRR____',
    '____RRRRRR____',
    '_____RRRR_____',
    '____RRRRRR____',   // legs together
    '____RRRRRR____',
    '____rrrrrr____',
  ],
  // ── Sleep frame ──
  sleep: [
    '______________',
    '______________',
    '______________',
    '______________',
    '______________',
    '______________',
    '______________',
    '______________',
    '______________',
    '___RRRRRRRR___',
    '__RRRrRRRrRR__',
    '__RRkkRRkkRR__',   // closed eyes
    '__RRRRRRRRRR__',
    '__RRRRrrRRRR__',
    '__RRRRRRRRRR__',
    '___RRRRRRRR___',
  ],
  // ── Work frame 1 (arms up / typing) ──
  work1: [
    '____RRRRRR____',
    '___RRRRRRRR___',
    '__RRRrRRRrRR__',
    '__RRWKRRWKRR__',
    '__RRRRRRRRRR__',
    '__RRRRrrRRRR__',
    '___RRRRRRRR___',
    '__RRRRRRRRR___',   // arm extended right
    '____RRRRRR____',
    '____RRRRRR____',
    '____RRRRRR____',
    '____RRRRRR____',
    '_____RRRR_____',
    '____RR__RR____',
    '____RR__RR____',
    '____rr__rr____',
  ],
  // ── Work frame 2 ──
  work2: [
    '____RRRRRR____',
    '___RRRRRRRR___',
    '__RRRrRRRrRR__',
    '__RRWKRRWKRR__',
    '__RRRRRRRRRR__',
    '__RRRRrrRRRR__',
    '___RRRRRRRR___',
    '___RRRRRRRRR__',   // arm extended left
    '____RRRRRR____',
    '____RRRRRR____',
    '____RRRRRR____',
    '____RRRRRR____',
    '_____RRRR_____',
    '____RR__RR____',
    '____RR__RR____',
    '____rr__rr____',
  ],
  // ── Happy frame (jump) ──
  happy: [
    '____RRRRRR____',
    '___RRRRRRRR___',
    '__RRRrRRRrRR__',
    '__RRWWRRWWRR__',   // big eyes
    '__RRRRRRRRRR__',
    '__RRrrRRrrRR__',   // smile
    '___RRRRRRRR___',
    '_RR_RRRRRR_RR_',   // arms up
    '____RRRRRR____',
    '____RRRRRR____',
    '____RRRRRR____',
    '____RRRRRR____',
    '_____RRRR_____',
    '____RR__RR____',
    '______________',   // airborne
    '______________',
  ],
  // ── Error frame (distressed) ──
  error: [
    '____RRRRRR____',
    '___RRRRRRRR___',
    '__RRRrRRRrRR__',
    '__RRWKRRWKRR__',   // worried eyes
    '__RRRRRRRRRR__',
    '__RRRrrrRRRR__',   // wavy mouth
    '___RRRRRRRR___',
    '___RRRRRRRR___',
    '____RRRRRR____',
    '____RRRRRR____',
    '____RRRRRR____',
    '____RRRRRR____',
    '_____RRRR_____',
    '____RR__RR____',
    '____RR__RR____',
    '____rr__rr____',
  ],
};

// Normalize all sprites to exactly 16 chars wide
for (const key in SPRITES) {
  SPRITES[key] = SPRITES[key].map(row => {
    if (row.length < 16) return row + '_'.repeat(16 - row.length);
    return row.substring(0, 16);
  });
  // Ensure 16 rows
  while (SPRITES[key].length < 16) SPRITES[key].push('________________');
}

// Pre-render sprites to offscreen canvases for performance
const SPRITE_SCALE = 4;  // 16x16 → 64x64
const spriteCache = {};
const spriteCacheFlipped = {};

function renderSpriteToCanvas(spriteData) {
  const c = document.createElement('canvas');
  c.width = 16 * SPRITE_SCALE;
  c.height = 16 * SPRITE_SCALE;
  const cx = c.getContext('2d');
  for (let y = 0; y < 16; y++) {
    const row = spriteData[y];
    for (let x = 0; x < 16; x++) {
      const ch = row[x];
      const color = PALETTE[ch];
      if (!color) continue;
      cx.fillStyle = color;
      cx.fillRect(x * SPRITE_SCALE, y * SPRITE_SCALE, SPRITE_SCALE, SPRITE_SCALE);
    }
  }
  return c;
}

function renderSpriteFlipped(spriteData) {
  const c = document.createElement('canvas');
  c.width = 16 * SPRITE_SCALE;
  c.height = 16 * SPRITE_SCALE;
  const cx = c.getContext('2d');
  for (let y = 0; y < 16; y++) {
    const row = spriteData[y];
    for (let x = 0; x < 16; x++) {
      const ch = row[x];
      const color = PALETTE[ch];
      if (!color) continue;
      cx.fillStyle = color;
      cx.fillRect((15 - x) * SPRITE_SCALE, y * SPRITE_SCALE, SPRITE_SCALE, SPRITE_SCALE);
    }
  }
  return c;
}

// Cache all sprites
for (const key in SPRITES) {
  spriteCache[key] = renderSpriteToCanvas(SPRITES[key]);
  spriteCacheFlipped[key] = renderSpriteFlipped(SPRITES[key]);
}


// ════════════════════════════════════════════════════════════
//  2. Room Background Renderer
// ════════════════════════════════════════════════════════════

let bgCanvas = null;
let lastBgW = 0, lastBgH = 0;

function renderBackground(w, h) {
  if (bgCanvas && lastBgW === w && lastBgH === h) return bgCanvas;

  bgCanvas = document.createElement('canvas');
  bgCanvas.width = w;
  bgCanvas.height = h;
  const bg = bgCanvas.getContext('2d');
  lastBgW = w;
  lastBgH = h;

  const floorY = Math.floor(h * 0.75);

  // Wall gradient
  const wallGrad = bg.createLinearGradient(0, 0, 0, floorY);
  wallGrad.addColorStop(0, '#0f3460');
  wallGrad.addColorStop(0.6, '#1a1a2e');
  wallGrad.addColorStop(1, '#16213e');
  bg.fillStyle = wallGrad;
  bg.fillRect(0, 0, w, floorY);

  // Floor
  bg.fillStyle = '#16213e';
  bg.fillRect(0, floorY, w, h - floorY);

  // Floor line
  bg.strokeStyle = '#2a3a5e';
  bg.lineWidth = 2;
  bg.beginPath();
  bg.moveTo(0, floorY);
  bg.lineTo(w, floorY);
  bg.stroke();

  // Floor grid dots
  bg.fillStyle = 'rgba(255,255,255,0.04)';
  for (let x = 0; x < w; x += 16) {
    for (let y = floorY + 8; y < h; y += 16) {
      bg.fillRect(x, y, 2, 2);
    }
  }

  // Wall grid dots
  bg.fillStyle = 'rgba(255,255,255,0.02)';
  for (let x = 0; x < w; x += 32) {
    for (let y = 0; y < floorY; y += 32) {
      bg.fillRect(x, y, 1, 1);
    }
  }

  // ── Furniture ──

  // Bed (left side)
  const bedX = Math.floor(w * 0.08);
  const bedY = floorY - 40;
  const bedW = 100;
  const bedH = 40;

  // Bed frame
  bg.fillStyle = '#4a3728';
  bg.fillRect(bedX, bedY, bedW, bedH);
  bg.fillStyle = '#3a2a1f';
  bg.fillRect(bedX, bedY + bedH - 4, bedW, 4);
  // Headboard
  bg.fillStyle = '#5a4738';
  bg.fillRect(bedX, bedY - 20, 8, 20 + bedH);
  // Pillow
  bg.fillStyle = '#ddd';
  bg.fillRect(bedX + 12, bedY + 4, 24, 14);
  bg.fillStyle = '#ccc';
  bg.fillRect(bedX + 12, bedY + 14, 24, 4);
  // Blanket
  bg.fillStyle = '#3355aa';
  bg.fillRect(bedX + 38, bedY + 4, bedW - 42, bedH - 8);
  bg.fillStyle = '#2244aa';
  bg.fillRect(bedX + 38, bedY + 4, bedW - 42, 4);

  // Desk (center-right)
  const deskX = Math.floor(w * 0.45);
  const deskY = floorY - 44;
  const deskW = 120;
  const deskH = 44;

  // Desk top
  bg.fillStyle = '#5a4738';
  bg.fillRect(deskX, deskY, deskW, 6);
  // Desk legs
  bg.fillStyle = '#4a3728';
  bg.fillRect(deskX + 4, deskY + 6, 6, deskH - 6);
  bg.fillRect(deskX + deskW - 10, deskY + 6, 6, deskH - 6);
  // Desk panel
  bg.fillStyle = '#3a2a1f';
  bg.fillRect(deskX + 4, deskY + 10, deskW - 8, 4);

  // Small monitor on desk
  const monX = deskX + Math.floor(deskW / 2) - 20;
  const monY = deskY - 30;
  bg.fillStyle = '#333';
  bg.fillRect(monX, monY, 40, 28);
  bg.fillStyle = '#0a0a12';
  bg.fillRect(monX + 3, monY + 3, 34, 20);
  // Monitor stand
  bg.fillStyle = '#333';
  bg.fillRect(monX + 16, monY + 28, 8, 4);
  bg.fillRect(monX + 12, monY + 32, 16, 3);
  // Screen glow
  bg.fillStyle = 'rgba(0,255,136,0.15)';
  bg.fillRect(monX + 3, monY + 3, 34, 20);
  // Screen lines (code-like)
  bg.fillStyle = '#00ff88';
  bg.globalAlpha = 0.4;
  bg.fillRect(monX + 6, monY + 7, 18, 2);
  bg.fillRect(monX + 6, monY + 11, 24, 2);
  bg.fillRect(monX + 6, monY + 15, 14, 2);
  bg.globalAlpha = 1.0;

  // Poster (upper left wall)
  const postX = Math.floor(w * 0.08);
  const postY = Math.floor(h * 0.10);
  bg.fillStyle = '#444';
  bg.fillRect(postX - 2, postY - 2, 64, 48);
  const posterGrad = bg.createLinearGradient(postX, postY, postX + 60, postY + 44);
  posterGrad.addColorStop(0, '#e94560');
  posterGrad.addColorStop(1, '#533483');
  bg.fillStyle = posterGrad;
  bg.fillRect(postX, postY, 60, 44);
  // Poster text
  bg.fillStyle = 'rgba(255,255,255,0.7)';
  bg.font = '6px monospace';
  bg.textAlign = 'center';
  bg.fillText('NANO', postX + 30, postY + 18);
  bg.fillText('CLAW', postX + 30, postY + 28);
  bg.fillText('v1.0', postX + 30, postY + 38);

  // Shelf (left wall, below poster)
  const shelfX = Math.floor(w * 0.06);
  const shelfY = Math.floor(h * 0.35);
  bg.fillStyle = '#4a3728';
  bg.fillRect(shelfX, shelfY, 80, 5);
  bg.fillStyle = '#3a2a1f';
  bg.fillRect(shelfX, shelfY + 5, 80, 2);
  // Books on shelf
  bg.fillStyle = '#e94560';
  bg.fillRect(shelfX + 8, shelfY - 16, 10, 16);
  bg.fillStyle = '#c23050';
  bg.fillRect(shelfX + 8, shelfY - 16, 10, 2);
  bg.fillStyle = '#533483';
  bg.fillRect(shelfX + 20, shelfY - 12, 8, 12);
  bg.fillStyle = '#3a2460';
  bg.fillRect(shelfX + 20, shelfY - 12, 8, 2);
  bg.fillStyle = '#6ec6ff';
  bg.fillRect(shelfX + 30, shelfY - 18, 10, 18);

  // Plant (right side)
  const plantX = Math.floor(w * 0.85);
  const plantY = floorY - 4;
  // Pot
  bg.fillStyle = '#8b4513';
  bg.beginPath();
  bg.moveTo(plantX - 10, plantY - 20);
  bg.lineTo(plantX + 10, plantY - 20);
  bg.lineTo(plantX + 12, plantY);
  bg.lineTo(plantX - 12, plantY);
  bg.closePath();
  bg.fill();
  // Leaves
  bg.fillStyle = '#2d8a4e';
  drawLeaf(bg, plantX - 6, plantY - 22, -0.35);
  drawLeaf(bg, plantX, plantY - 22, 0);
  drawLeaf(bg, plantX + 6, plantY - 22, 0.35);

  return bgCanvas;
}

function drawLeaf(cx, x, y, angle) {
  cx.save();
  cx.translate(x, y);
  cx.rotate(angle);
  cx.beginPath();
  cx.ellipse(0, -12, 5, 12, 0, 0, Math.PI * 2);
  cx.fill();
  cx.restore();
}

// ════════════════════════════════════════════════════════════
//  3. Character State Machine
// ════════════════════════════════════════════════════════════

const STATE_PRIORITY = { sleep: 0, idle: 1, walk: 2, work: 3, happy: 4, error: 5 };

const character = {
  x: 0,
  y: 0,
  targetX: 0,
  targetY: 0,
  facing: 1,       // 1 = right, -1 = left
  state: 'sleep',
  prevState: 'sleep',
  frame: 0,
  frameTimer: 0,
  stateTimer: 0,
  idleTimer: 0,
  wanderTimer: 0,
  shakeOffset: 0,
  jumpOffset: 0,
  speed: 1.5,
};

// Room positions (will be recalculated on resize)
const positions = {
  bed: { x: 0, y: 0 },
  desk: { x: 0, y: 0 },
  center: { x: 0, y: 0 },
};

function updatePositions(w, h) {
  const floorY = Math.floor(h * 0.75);
  positions.bed.x = Math.floor(w * 0.08) + 50;
  positions.bed.y = floorY - 40;
  positions.desk.x = Math.floor(w * 0.45) + 60;
  positions.desk.y = floorY - 64;
  positions.center.x = Math.floor(w * 0.35);
  positions.center.y = floorY - 64;
}

function requestState(newState) {
  const newPri = STATE_PRIORITY[newState] ?? 0;
  const curPri = STATE_PRIORITY[character.state] ?? 0;

  // Always allow transition to sleep/idle from anything
  if (newState === 'sleep' || newState === 'idle') {
    if (character.state === newState) return;
    character.prevState = character.state;
    character.state = newState;
    character.stateTimer = 0;
    character.frame = 0;
    character.frameTimer = 0;

    if (newState === 'sleep') {
      character.targetX = positions.bed.x;
      character.targetY = positions.bed.y;
      // Walk to bed first if not already there
      if (Math.abs(character.x - positions.bed.x) > 10) {
        character.state = 'walk';
        character.prevState = 'walk';
        // Will transition to sleep upon arrival
        character._pendingState = 'sleep';
      }
    }
    return;
  }

  // For higher priority states, override current
  if (newPri >= curPri || character.state === 'idle' || character.state === 'walk') {
    character.prevState = character.state;
    character.state = newState;
    character.stateTimer = 0;
    character.frame = 0;
    character.frameTimer = 0;

    if (newState === 'work') {
      character.targetX = positions.desk.x;
      character.targetY = positions.desk.y;
    }
  }
}

function getRandomFloorPos(w, h) {
  const floorY = Math.floor(h * 0.75);
  const margin = 80;
  return {
    x: margin + Math.random() * (w - margin * 2),
    y: floorY - 64,
  };
}


// ════════════════════════════════════════════════════════════
//  4. Particle System
// ════════════════════════════════════════════════════════════

const particles = [];

function spawnParticle(type, x, y) {
  switch (type) {
    case 'zzz':
      particles.push({
        type: 'zzz',
        x: x + 40,
        y: y - 10,
        vx: 0.3,
        vy: -0.6,
        life: 90,
        maxLife: 90,
        char: 'z',
        size: 8 + Math.random() * 4,
      });
      break;
    case 'sparkle':
      for (let i = 0; i < 7; i++) {
        const angle = (Math.PI * 2 * i) / 7;
        particles.push({
          type: 'sparkle',
          x: x + 32,
          y: y + 32,
          vx: Math.cos(angle) * (1.5 + Math.random()),
          vy: Math.sin(angle) * (1.5 + Math.random()),
          life: 40 + Math.random() * 20,
          maxLife: 60,
          size: 3 + Math.random() * 3,
          color: ['#ffd740', '#ffeb3b', '#fff', '#00ff88'][Math.floor(Math.random() * 4)],
        });
      }
      break;
    case 'sweat':
      particles.push({
        type: 'sweat',
        x: x + (Math.random() > 0.5 ? 50 : 14),
        y: y,
        vx: 0,
        vy: 1.5,
        life: 40,
        maxLife: 40,
        size: 4,
      });
      break;
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }
}

function drawParticles(cx) {
  for (const p of particles) {
    const alpha = Math.min(1, p.life / (p.maxLife * 0.3));
    cx.globalAlpha = alpha;

    switch (p.type) {
      case 'zzz':
        cx.font = `bold ${Math.floor(p.size)}px "Press Start 2P", monospace`;
        cx.fillStyle = '#8888cc';
        cx.fillText('z', p.x, p.y);
        break;
      case 'sparkle':
        cx.fillStyle = p.color;
        // 4-point star
        const s = p.size;
        cx.beginPath();
        cx.moveTo(p.x, p.y - s);
        cx.lineTo(p.x + s * 0.3, p.y - s * 0.3);
        cx.lineTo(p.x + s, p.y);
        cx.lineTo(p.x + s * 0.3, p.y + s * 0.3);
        cx.lineTo(p.x, p.y + s);
        cx.lineTo(p.x - s * 0.3, p.y + s * 0.3);
        cx.lineTo(p.x - s, p.y);
        cx.lineTo(p.x - s * 0.3, p.y - s * 0.3);
        cx.closePath();
        cx.fill();
        break;
      case 'sweat':
        cx.fillStyle = '#6ec6ff';
        cx.beginPath();
        cx.moveTo(p.x, p.y);
        cx.quadraticCurveTo(p.x + p.size, p.y + p.size * 2, p.x, p.y + p.size * 3);
        cx.quadraticCurveTo(p.x - p.size, p.y + p.size * 2, p.x, p.y);
        cx.fill();
        break;
    }
    cx.globalAlpha = 1.0;
  }
}


// ════════════════════════════════════════════════════════════
//  5. Game Loop
// ════════════════════════════════════════════════════════════

let lastTime = 0;
let tickAccum = 0;
const TICK_RATE = 1000 / 30;  // 30 fps logic
let zzzTimer = 0;
let sweatTimer = 0;

function resize() {
  const area = canvas.parentElement;
  const dpr = window.devicePixelRatio || 1;
  const w = area.clientWidth;
  const h = area.clientHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  updatePositions(w, h);
  // Invalidate bg cache
  lastBgW = 0;
}

function init() {
  resize();
  window.addEventListener('resize', resize);

  const w = canvas.parentElement.clientWidth;
  const h = canvas.parentElement.clientHeight;

  // Start at bed
  character.x = positions.bed.x;
  character.y = positions.bed.y;
  character.targetX = character.x;
  character.targetY = character.y;
  character.state = 'sleep';

  requestAnimationFrame(gameLoop);
}

function gameLoop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const dt = timestamp - lastTime;
  lastTime = timestamp;

  tickAccum += dt;
  while (tickAccum >= TICK_RATE) {
    update();
    tickAccum -= TICK_RATE;
  }

  draw();
  requestAnimationFrame(gameLoop);
}

function update() {
  const w = canvas.parentElement.clientWidth;
  const h = canvas.parentElement.clientHeight;

  character.stateTimer++;
  character.frameTimer++;

  // ── State-specific updates ──
  switch (character.state) {
    case 'sleep':
      // Zzz particles
      zzzTimer++;
      if (zzzTimer > 50) {
        spawnParticle('zzz', character.x, character.y);
        zzzTimer = 0;
      }
      break;

    case 'idle':
      // Blink occasionally
      character.idleTimer++;
      character.wanderTimer++;

      // Wander after 300 ticks (~10s)
      if (character.wanderTimer > 300) {
        const pos = getRandomFloorPos(w, h);
        character.targetX = pos.x;
        character.targetY = pos.y;
        requestState('walk');
        character.wanderTimer = 0;
      }
      break;

    case 'walk': {
      const dx = character.targetX - character.x;
      const dy = character.targetY - character.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist > 3) {
        character.x += (dx / dist) * character.speed;
        character.y += (dy / dist) * character.speed;
        character.facing = dx > 0 ? 1 : -1;
      } else {
        character.x = character.targetX;
        character.y = character.targetY;
        // Check for pending state
        if (character._pendingState) {
          const pending = character._pendingState;
          character._pendingState = null;
          character.state = pending;
          character.stateTimer = 0;
          character.frame = 0;
        } else {
          requestState('idle');
        }
      }
      break;
    }

    case 'work':
      // Walk to desk first
      {
        const dx = positions.desk.x - character.x;
        const dy = positions.desk.y - character.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 3) {
          character.x += (dx / dist) * character.speed;
          character.y += (dy / dist) * character.speed;
          character.facing = dx > 0 ? 1 : -1;
        } else {
          character.facing = 1; // face desk
        }
      }
      // Return to idle after 3s (90 ticks)
      if (character.stateTimer > 90) {
        requestState('idle');
      }
      break;

    case 'happy':
      // Jump animation
      character.jumpOffset = -Math.abs(Math.sin(character.stateTimer * 0.2)) * 16;
      // Sparkle burst at start
      if (character.stateTimer === 1) {
        spawnParticle('sparkle', character.x, character.y);
      }
      // Return to idle after 3s
      if (character.stateTimer > 90) {
        character.jumpOffset = 0;
        requestState('idle');
      }
      break;

    case 'error':
      // Shake
      character.shakeOffset = (Math.random() - 0.5) * 6;
      // Sweat
      sweatTimer++;
      if (sweatTimer > 15) {
        spawnParticle('sweat', character.x, character.y);
        sweatTimer = 0;
      }
      // Return to idle after 2s
      if (character.stateTimer > 60) {
        character.shakeOffset = 0;
        requestState('idle');
      }
      break;
  }

  // Frame animation
  if (character.frameTimer > 10) {
    character.frame = (character.frame + 1) % 2;
    character.frameTimer = 0;
  }

  updateParticles();
}

function getSpriteName() {
  switch (character.state) {
    case 'sleep': return 'sleep';
    case 'idle': return character.frame === 0 && character.idleTimer % 120 > 110 ? 'idle2' : 'idle1';
    case 'walk': return character.frame === 0 ? 'walk1' : 'walk2';
    case 'work': return character.frame === 0 ? 'work1' : 'work2';
    case 'happy': return 'happy';
    case 'error': return 'error';
    default: return 'idle1';
  }
}

function draw() {
  const w = canvas.parentElement.clientWidth;
  const h = canvas.parentElement.clientHeight;

  // Clear
  ctx.clearRect(0, 0, w, h);

  // Background
  const bg = renderBackground(w, h);
  ctx.drawImage(bg, 0, 0);

  // Character shadow
  const floorY = Math.floor(h * 0.75);
  const shadowY = floorY - 6;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(
    character.x + 32,
    shadowY,
    24, 6, 0, 0, Math.PI * 2
  );
  ctx.fill();

  // Character sprite
  const spriteName = getSpriteName();
  const cache = character.facing === 1 ? spriteCache : spriteCacheFlipped;
  const sprite = cache[spriteName];

  if (sprite) {
    const drawX = character.x + character.shakeOffset;
    const drawY = character.y + character.jumpOffset;
    ctx.drawImage(sprite, drawX, drawY);
  }

  // Particles
  drawParticles(ctx);

  // Status orb (on the desk monitor)
  if (botRunning) {
    const orbX = Math.floor(w * 0.45) + 60 + 14;
    const orbY = Math.floor(h * 0.75) - 44 - 30 + 8;
    ctx.fillStyle = '#00ff88';
    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(orbX, orbY, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}


// ════════════════════════════════════════════════════════════
//  6. SSE / Controls (same interface as before)
// ════════════════════════════════════════════════════════════

function setRunning(running) {
  botRunning = running;
  statusDot.className = 'status-dot' + (running ? ' on' : '');
  statusLabel.className = 'status-text' + (running ? ' on' : '');
  statusLabel.textContent = running ? 'Running' : 'Offline';
  btnStart.disabled = running;
  btnStop.disabled = !running;

  if (running) {
    // Wake up: sleep → idle
    if (character.state === 'sleep') {
      requestState('idle');
      // Walk to center
      const w = canvas.parentElement.clientWidth;
      const h = canvas.parentElement.clientHeight;
      const pos = getRandomFloorPos(w, h);
      character.targetX = pos.x;
      character.targetY = pos.y;
      character.state = 'walk';
      character._pendingState = null;
    }

    if (!startTime) {
      startTime = Date.now();
      uptimeTimer = setInterval(updateUptime, 1000);
    }
  } else {
    // Go to sleep
    requestState('sleep');
    startTime = null;
    clearInterval(uptimeTimer);
    uptimeVal.textContent = '--:--:--';
  }
}

function updateUptime() {
  if (!startTime) return;
  const diff = Math.floor((Date.now() - startTime) / 1000);
  const h = String(Math.floor(diff / 3600)).padStart(2, '0');
  const m = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
  const s = String(diff % 60).padStart(2, '0');
  uptimeVal.textContent = `${h}:${m}:${s}`;
}

function addLog(text, type) {
  const div = document.createElement('div');
  div.className = 'log-line' + (type ? ' ' + type : '');
  div.textContent = text;
  logScreen.appendChild(div);

  while (logScreen.children.length > 500) {
    logScreen.removeChild(logScreen.firstChild);
  }
  logScreen.scrollTop = logScreen.scrollHeight;

  // ── Trigger character reactions ──
  if (!botRunning) return;

  const lower = text.toLowerCase();

  if (lower.includes('error') || lower.includes('fatal')) {
    requestState('error');
  } else if (lower.includes('connected') || lower.includes('success') || lower.includes('authenticated')) {
    requestState('happy');
  } else {
    // Any log = work
    requestState('work');
    character.wanderTimer = 0;  // reset wander timer
  }
}

function connectSSE() {
  if (eventSource) eventSource.close();
  eventSource = new EventSource('/events');

  eventSource.addEventListener('log', (e) => {
    const data = JSON.parse(e.data);
    addLog(data.text, data.type);
  });

  eventSource.addEventListener('status', (e) => {
    const data = JSON.parse(e.data);
    setRunning(data.running);
    if (data.running && data.uptime) {
      startTime = Date.now() - data.uptime * 1000;
      if (!uptimeTimer) uptimeTimer = setInterval(updateUptime, 1000);
      updateUptime();
    }
  });

  eventSource.onerror = () => {
    setTimeout(connectSSE, 3000);
  };
}

async function startBot() {
  btnStart.disabled = true;
  addLog('> Starting bot...', 'info');
  try {
    const res = await fetch('/start', { method: 'POST' });
    const data = await res.json();
    if (!data.ok) addLog('Error: ' + data.error, 'error');
  } catch (e) {
    addLog('Failed to start: ' + e.message, 'error');
    btnStart.disabled = false;
  }
}

async function stopBot() {
  btnStop.disabled = true;
  addLog('> Stopping bot...', 'info');
  try {
    const res = await fetch('/stop', { method: 'POST' });
    const data = await res.json();
    if (!data.ok) addLog('Error: ' + data.error, 'error');
  } catch (e) {
    addLog('Failed to stop: ' + e.message, 'error');
    btnStop.disabled = false;
  }
}

async function checkStatus() {
  try {
    const res = await fetch('/status');
    const data = await res.json();
    setRunning(data.running);
    if (data.running && data.uptime) {
      startTime = Date.now() - data.uptime * 1000;
      if (!uptimeTimer) uptimeTimer = setInterval(updateUptime, 1000);
      updateUptime();
    }
  } catch (e) {
    // server not ready
  }
}

// ── Boot ──
init();
checkStatus();
connectSSE();
</script>
